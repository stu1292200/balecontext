[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "balecontext"
version = "0.1.0"
description = "Local project knowledge for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Muhammad Baleegh"}]
keywords = ["mcp", "coding-agents", "knowledge-graph", "context", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Repository = "https://github.com/stu1292200/balecontext"
Issues = "https://github.com/stu1292200/balecontext/issues"

[project.optional-dependencies]
code = ["tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.25,<0.26", "tree-sitter-typescript>=0.23,<0.24"]

[project.scripts]
balecontext = "balecontext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
balecontext = ["viewer.html"]
